# Stage 2 for 16Sep2026 kinesin + GMPCPP, micrograph 20260916_lysates_2_0031:
# one constrained match_template with the 14-PF EXPANDED ring (GMPCPP), on GPU 3.
#
#   python run_scripts/run_match_curved.py --prefix kinesin_ --tag 2_0031_14pf \
#       --results results_kinesin_2_0031 \
#       --constraint configs/filament_constraint_kinesin_2_0031.yaml --gpus 3
#
# The full uniform SO(3) grid is searched (no angle restricted here); the sidecar only
# gates which (pixel, orientation) may win the MIP -- the five curated paths, 52 nm bands,
# psi within 20 deg of each path, theta 90 +/- 20 -- and statistics come from the whole
# grid so z stays comparable to an unconstrained search.
#
# Cost on ONE GPU (823 measured 175 correlations/s per GPU on this image size):
#   psi 2.5 / theta 3.5, 9 defocus planes: 485,856 orientations -> ~6.9 h   <- this file
#   psi 1.5 / theta 2.5, 9 planes: 1,584,480 orientations -> ~22.6 h (the in situ grid)
micrograph_path: results_kinesin/20260916_lysates_2_0031_DW.mrc
template_volume_path: maps/6dpu_14pf_2rings_flatB_1.13_bscale0.5.mrc
computational_config:
  gpu_ids:
  - 3
  num_cpus: 8
defocus_search_config:
  # PICASSO's defocus field for this micrograph spans 7,032-8,761 A about the 7,827 A
  # mean (a tilt), so +/-800 A in 200 A steps (9 planes) covers it.
  enabled: true
  defocus_min: -800.0
  defocus_max: 800.0
  defocus_step: 200.0
match_template_result:
  allow_file_overwrite: true
  correlation_average_path: results_kinesin_2_0031/output_correlation_average_kinesin_2_0031_14pf.mrc
  correlation_variance_path: results_kinesin_2_0031/output_correlation_variance_kinesin_2_0031_14pf.mrc
  mip_path: results_kinesin_2_0031/output_mip_kinesin_2_0031_14pf.mrc
  orientation_phi_path: results_kinesin_2_0031/output_orientation_phi_kinesin_2_0031_14pf.mrc
  orientation_psi_path: results_kinesin_2_0031/output_orientation_psi_kinesin_2_0031_14pf.mrc
  orientation_theta_path: results_kinesin_2_0031/output_orientation_theta_kinesin_2_0031_14pf.mrc
  relative_defocus_path: results_kinesin_2_0031/output_relative_defocus_kinesin_2_0031_14pf.mrc
  scaled_mip_path: results_kinesin_2_0031/output_scaled_mip_kinesin_2_0031_14pf.mrc
optics_group:
  # From PICASSO (results_ctf_kinesin/20260916_lysates_2_0031_DW_optics.yaml); astigmatism
  # is ~0 A, so its angle is immaterial. ctf_B_factor 60 as in every search here.
  label: 20260916_lysates_2_0031
  amplitude_contrast_ratio: 0.07
  ctf_B_factor: 60.0
  astigmatism_angle: 18.110103150316235
  defocus_u: 7827.255957489001
  defocus_v: 7827.245957489026
  phase_shift: 0.0
  pixel_size: 1.13
  spherical_aberration: 2.7
  voltage: 200.0
orientation_search_config:
  base_grid_method: uniform
  psi_step: 2.5
  theta_step: 3.5
preprocessing_filters:
  bandpass_filter:
    enabled: false
    falloff: 0.05
    high_freq_cutoff: 0.5
    low_freq_cutoff: 0.0
  whitening_filter:
    enabled: true
    do_power_spectrum: true
    max_freq: 1.0
    num_freq_bins: null
