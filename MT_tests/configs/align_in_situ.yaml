# RIPPLE motion correction for the in situ (unroofed cell) K3 movies.
#
# Everything under `movie_config` that varies per movie -- movie_path, pixel_size,
# voltage, fluence -- is OVERWRITTEN from that movie's .mdoc by
# run_scripts/run_ripple_in_situ.py. What is set here is the part the mdoc does not
# carry: the gain reference, the super-resolution factor, and the fluence per frame.
#
# The movies are K3 super-resolution counting frames, uint8, 11520 x 8184, 50 frames,
# saved raw (SerialEM tag "r/f 0 need 7") with the gain reference kept alongside as a
# dm4 of exactly the same shape. So no gain rotation or flip, and it is a multiplicative
# normalisation (values 0.50-2.00, median 0.999).
#
# mdoc PixelSpacing is 0.528 A, the SUPER-RESOLUTION pixel. super_resolution_factor: 2
# Fourier-crops the corrected movie before summing, so the outputs land at 1.056 A/px.

computational_config:
  gpu_id: 0                 # overridden per worker by the runner
  keep_movie_on_cpu: true   # 50 x 8184 x 11520 float32 = 18.8 GB; stream it

movie_config:
  movie_path: null          # set per movie
  pixel_size: 0.528         # super-resolution pixel, from the mdoc
  super_resolution_factor: 2  # -> 1.056 A/px sums
  fluence: 50.0             # 50 frames x 1 e-/A^2
  fluence_per_frame: 1.0    # as collected; the mdoc's ExposureDose is 0 and unusable
  pre_exposure: 0.0
  voltage: 300.0
  gain_path: "/data/lucas_2023_vol1/lucas_2023_vol1/nrs/lucasb/unroofed_cells/gain_20220808_CDS_krios_NICE/gain_20220808_CDS.dm4"
  dark_path: null
  gain_flip: 0
  gain_rot: 0
  multiply_gain: true

output_config:
  allow_file_overwrite: true
  dw_sum_output_path: null              # set per movie
  non_dw_sum_output_path: null
  deformation_field_output_path: null   # set per movie
  rendered_movie_output_path: null
  motion_corrected_movie_output_path: null
  loss_trajectories_output_path: null

alignment_config:
  # 50 frames, 4 x 4 spatial control points over a 608 x 432 nm field.
  deformation_field_resolution: [50, 4, 4]
  deformation_field_path: null
  use_xc_prepass: true
  max_iterations: 100
  patch_shape: [1024, 1024]
  grid_type: "catmull_rom"
  loss_type: "ncc"
  optimizer_type: "adam"
  learning_rate: 0.2
  b_factor: 500.0
  frequency_range: [300.0, 10.0]
  skip_movie_preparation: false
  early_stopping: true
  early_stopping_patience: 5
  early_stopping_window_size: 3
  early_stopping_tolerance: 1.0e-5
